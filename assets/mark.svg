<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Deskly">
  <rect width="80" height="80" rx="16" fill="#0c0a08"/>
  <!-- raw coworking desk + chair, side view -->
  <g fill="none" stroke="#c2a67a" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
    <!-- desktop -->
    <path d="M16 38h48"/>
    <!-- desk legs -->
    <path d="M22 38v22"/>
    <path d="M58 38v22"/>
    <!-- chair seat + back -->
    <path d="M30 38v-12"/>
    <path d="M30 26h12"/>
  </g>
  <!-- small work accent: laptop lid -->
  <path d="M42 38l10-8" fill="none" stroke="#f2ebe0" stroke-width="2" stroke-linecap="square"/>
</svg>
