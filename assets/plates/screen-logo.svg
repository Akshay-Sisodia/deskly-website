<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ffbe78" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#ffbe78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4a2f"/>
      <stop offset="50%" stop-color="#c2a67a"/>
      <stop offset="100%" stop-color="#8a6a48"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0e0c0a"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- simplified room silhouette -->
  <rect x="560" y="520" width="800" height="24" rx="6" fill="url(#wood)" opacity=".85"/>
  <rect x="620" y="544" width="20" height="90" rx="4" fill="#3a2a1c" opacity=".8"/>
  <rect x="1280" y="544" width="20" height="90" rx="4" fill="#3a2a1c" opacity=".8"/>
  <rect x="640" y="430" width="70" height="55" rx="10" fill="#4a4038" opacity=".75"/>
  <rect x="780" y="420" width="70" height="55" rx="10" fill="#4a4038" opacity=".75"/>
  <rect x="1070" y="420" width="70" height="55" rx="10" fill="#4a4038" opacity=".75"/>
  <rect x="1210" y="430" width="70" height="55" rx="10" fill="#4a4038" opacity=".75"/>

  <text x="960" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" letter-spacing="14" fill="#c2a67a">DESKLY</text>
  <text x="960" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="68" fill="#f5efe6">A better place to meet.</text>
  <text x="960" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#ffd9a8">Private desks and rooms for teams that need focus.</text>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle" fill="#f5efe6">
    <text x="560" y="760" font-size="20" letter-spacing="3" fill="#c2a67a">EXECUTIVE</text>
    <text x="560" y="810" font-size="36" font-weight="600">12 seats</text>
    <text x="960" y="760" font-size="20" letter-spacing="3" fill="#c2a67a">CONFERENCE</text>
    <text x="960" y="810" font-size="36" font-weight="600">16 seats</text>
    <text x="1360" y="760" font-size="20" letter-spacing="3" fill="#c2a67a">LOCATION</text>
    <text x="1360" y="810" font-size="36" font-weight="600">Royapettah</text>
  </g>
</svg>
